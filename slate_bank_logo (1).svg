<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <defs>
    <linearGradient id="slateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A99AB"/>
      <stop offset="0.55" stop-color="#6C7A89"/>
      <stop offset="1" stop-color="#4E5A68"/>
    </linearGradient>
    <linearGradient id="slateGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7B3C2"/>
      <stop offset="1" stop-color="#6C7A89"/>
    </linearGradient>
    <style>
      /* ---- draw-in animations (can be re-triggered or extended later) ---- */
      @keyframes drawStroke { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes shimmer { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

      #slate-s-top, #slate-s-bottom {
        stroke-dasharray: var(--len);
        stroke-dashoffset: var(--len);
        animation: drawStroke 1.4s cubic-bezier(.6,.05,.2,1) forwards;
      }
      #slate-s-top   { --len: 320; animation-delay: .2s; }
      #slate-s-bottom{ --len: 320; animation-delay: .7s; }
      #slate-notch  { animation: fadeUp .8s ease .9s both; }
      #wordmark text, #tagline, #chip {
        animation: fadeUp .9s cubic-bezier(.2,.7,.2,1) both;
      }
      #wordmark .l1 { animation-delay: 1.1s; } #wordmark .l2 { animation-delay: 1.18s; }
      #wordmark .l3 { animation-delay: 1.26s; } #wordmark .l4 { animation-delay: 1.34s; }
      #wordmark .l5 { animation-delay: 1.42s; } #wordmark .l6 { animation-delay: 1.5s; }
      #wordmark .l7 { animation-delay: 1.58s; } #wordmark .l8 { animation-delay: 1.66s; }
      #wordmark .l9 { animation-delay: 1.74s; } #wordmark .l10{ animation-delay: 1.82s; }
      #tagline { animation-delay: 2.0s; }
      #chip    { animation-delay: 2.2s; }
      #slate-glint { animation: shimmer 3.4s ease-in-out 2.4s infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="640" rx="24" fill="#F4F6F8"/>

  <!-- ================= PRIMARY LOCKUP ================= -->
  <g id="logo-lockup" transform="translate(450,215)">
    <g id="mark">
      <!-- S formed from two rounded strokes, plus a white notch cut -->
      <path id="slate-s-top" d="M 42 -52 A 52 52 0 0 0 -42 -52" fill="none" stroke="url(#slateGrad)" stroke-width="34" stroke-linecap="round"/>
      <path id="slate-s-bottom" d="M -42 52 A 52 52 0 0 0 42 52" fill="none" stroke="url(#slateGrad)" stroke-width="34" stroke-linecap="round"/>
      <rect id="slate-notch" x="-26" y="-9" width="52" height="18" rx="9" fill="#FFFFFF"/>
      <path id="slate-glint" d="M 42 -52 A 52 52 0 0 0 -42 -52" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".35"/>
    </g>
  </g>

  <g id="wordmark" transform="translate(450,345)" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="60" letter-spacing="12" fill="#4E5A68">
    <text class="l1" x="-214" y="0">S</text>
    <text class="l2" x="-152" y="0">L</text>
    <text class="l3" x="-96"  y="0">A</text>
    <text class="l4" x="-34"  y="0">T</text>
    <text class="l5" x="26"   y="0">E</text>
    <text class="l6" x="122"  y="0" fill="#8A99AB">B</text>
    <text class="l7" x="178"  y="0" fill="#8A99AB">A</text>
    <text class="l8" x="240"  y="0" fill="#8A99AB">N</text>
    <text class="l9" x="302"  y="0" fill="#8A99AB">K</text>
  </g>

  <text id="tagline" x="450" y="392" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="7" fill="#6C7A89">BANKING IN ITS TRUEST FORM</text>

  <line x1="300" y1="432" x2="600" y2="432" stroke="#D8DFE7" stroke-width="2"/>

  <!-- ================= APP ICON (animated variant) ================= -->
  <g id="app-icon" transform="translate(450,525)">
    <rect x="-64" y="-56" width="128" height="112" rx="28" fill="url(#slateGrad)"/>
    <path id="icon-s-top" d="M 30 -26 A 28 28 0 0 0 -30 -26" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round"/>
    <path id="icon-s-bottom" d="M -30 26 A 28 28 0 0 0 30 26" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round"/>
    <rect id="slate-notch" x="-15" y="-5" width="30" height="10" rx="5" fill="#6C7A89"/>
  </g>
  <text id="chip" x="450" y="606" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#8A99AB">APP ICON</text>
</svg>